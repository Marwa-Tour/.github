name: Validate branch and commits

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    uses: Marwa-Tour/.github/.github/workflows/validate-branch-and-commits.yml@main
